name: Check installation and basic tests

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test_install:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.15"]
        # setup-python has no Ubuntu 26.04 builds for Python 3.8 or 3.9.
        include:
          - python-version: "3.8"
            runner: ubuntu-24.04
          - python-version: "3.9"
            runner: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install MIMOSA and test dependencies
        run: |
          python -m pip install ".[test]"

      - name: Dependency check
        run: |
          pip check

      - name: Run tests (excluding ipopt)
        run: |
          python -m pytest tests -m "not ipopt"
